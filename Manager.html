<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UDS Manager Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f8f9fb;
  --card:#ffffff;
  --card-border:#e8ecf0;
  --card-shadow:rgba(0,0,0,.06);
  --text:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --input-bg:#f1f5f9;
  --brand:#2563eb;
  --brand-dark:#1d4ed8;
  --red:#dc2626;
  --green:#16a34a;
  --amber:#d97706;
  --sidebar:#ffffff;
  --sidebar-border:#e8ecf0;
}

body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;}

/* ── LAYOUT ── */
.app-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{background:var(--sidebar);border-right:1.5px solid var(--sidebar-border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-top{padding:24px 20px 20px;border-bottom:1.5px solid var(--sidebar-border);}
.wordmark{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.03em;}
.wordmark span{color:var(--brand);}
.route-tag{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 10px;background:#eff6ff;color:var(--brand);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:20px;}

.sidebar-section{padding:20px 20px 8px;}
.sidebar-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}

.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif;}
.nav-item:hover{background:#f1f5f9;}
.nav-item.active{background:#eff6ff;}
.nav-item-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0;}
.nav-item-label{font-size:13px;font-weight:700;color:var(--text2);}
.nav-item.active .nav-item-label{color:var(--brand);}

.sidebar-divider{height:1px;background:var(--sidebar-border);margin:8px 20px;}

.rep-strip{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:2px;}
.rep-strip:hover{background:#f1f5f9;}
.rep-strip-left{min-width:0;}
.rep-strip-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-strip-meta{font-size:10px;color:var(--text3);margin-top:1px;font-family:'JetBrains Mono',monospace;}
.rep-strip-pct{font-size:14px;font-weight:800;font-family:'JetBrains Mono',monospace;flex-shrink:0;margin-left:8px;}

.sync-area{margin-top:auto;padding:16px 20px;border-top:1.5px solid var(--sidebar-border);}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;letter-spacing:.04em;background:var(--input-bg);color:var(--text3);cursor:pointer;border:1.5px solid var(--card-border);font-family:'Inter',sans-serif;transition:all .2s;width:100%;justify-content:center;}
.sync-badge.loading{background:#fef3c7;color:var(--amber);border-color:#fde68a;}
.sync-badge.ok{background:#f0fdf4;color:var(--green);border-color:#bbf7d0;}
.sync-badge.err{background:#fef2f2;color:var(--red);border-color:#fecaca;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.sync-badge.ok .sync-dot{animation:pulse2 2s infinite;}
@keyframes pulse2{0%,100%{opacity:1;}50%{opacity:.4;}}

/* ── MAIN ── */
.main{overflow:auto;display:flex;flex-direction:column;}

/* Top bar */
.topbar{padding:24px 28px 20px;border-bottom:1.5px solid var(--card-border);display:flex;align-items:flex-start;justify-content:space-between;background:var(--card);}
.topbar-left{}
.page-headline{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1.1;}
.page-headline span{color:var(--brand);}
.page-meta{font-size:12px;color:var(--text3);margin-top:5px;}
.topbar-actions{display:flex;gap:8px;align-items:center;margin-top:4px;}
.btn-outline{padding:9px 16px;border:1.5px solid var(--card-border);background:var(--card);color:var(--text2);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:border-color .15s;}
.btn-outline:hover{border-color:#94a3b8;}
.btn-primary{padding:9px 16px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 1px 3px rgba(37,99,235,.3);}
.btn-primary:hover{background:var(--brand-dark);}
.btn-danger{padding:9px 16px;background:#fef2f2;color:var(--red);border:1.5px solid #fecaca;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}

/* Content area */
.content{padding:24px 28px;flex:1;}

/* Team filter tabs */
.team-tabs{display:flex;gap:6px;margin-bottom:20px;}
.team-tab{padding:8px 16px;border:1.5px solid var(--card-border);border-radius:20px;background:var(--card);font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
.team-tab:hover{border-color:#94a3b8;color:var(--text2);}
.team-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);}
.team-tab .tt-count{font-size:10px;opacity:.8;margin-left:4px;}

/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi-card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:18px 20px;position:relative;}
.kpi-val{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1;}
.kpi-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-top:6px;}
.kpi-badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
.kpi-badge.up{background:#f0fdf4;color:var(--green);}
.kpi-badge.down{background:#fef2f2;color:var(--red);}
.kpi-badge.warn{background:#fffbeb;color:var(--amber);}
.kpi-badge.info{background:#eff6ff;color:var(--brand);}

/* Main grid */
.main-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;}

/* Cards */
.card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:20px;}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);}
.card-action{font-size:12px;font-weight:700;color:var(--brand);cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;}

/* SKU tiles */
.sku-scroll{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:22px;}
.sku-tile{background:var(--card);border:1.5px solid var(--card-border);border-radius:12px;padding:14px 10px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:center;}
.sku-tile:hover{border-color:#94a3b8;}
.sku-tile.fil{border-width:2px;}
.sku-lbl{font-size:10px;font-weight:700;color:var(--text2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sku-pct{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:2px;}
.sku-sub{font-size:9px;color:var(--text3);margin-top:2px;}
.sku-tile.fil .sku-sub{font-weight:700;}

/* Filter banner */
.fil-banner{display:flex;align-items:center;justify-content:space-between;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;font-weight:700;color:var(--brand);}
.ban-x{background:none;border:none;color:var(--brand);font-size:16px;cursor:pointer;padding:0 4px;line-height:1;}

/* Rep cards */
.rep-list{display:flex;flex-direction:column;gap:10px;}
.rep-card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;overflow:hidden;}
.rep-hdr{padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .15s;}
.rep-hdr:hover{background:#f8fafc;}
.rep-info{flex:1;min-width:0;}
.rep-name{font-size:15px;font-weight:800;color:var(--text);}
.rep-route{font-size:11px;color:var(--text3);margin-top:1px;font-family:'JetBrains Mono',monospace;}
.rep-ts{font-size:10px;color:var(--text3);margin-top:2px;}
.rep-right{text-align:right;flex-shrink:0;}
.rep-pct{font-size:24px;font-weight:900;font-family:'JetBrains Mono',monospace;}
.rep-acct-count{font-size:10px;color:var(--text3);margin-top:2px;}
.rep-bar{height:3px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:0 18px 6px;}
.rep-bar-fill{height:100%;border-radius:99px;transition:width .5s;}

/* Insights section */
.insights-section{margin-bottom:22px;}
.insights-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.insights-card{overflow:hidden;}
.insights-wide{grid-column:1/-1;}

/* SKU chip buttons */
.rsc-btn{height:22px;padding:0 8px;border:none;border-radius:99px;font-size:9px;font-weight:800;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:3px;letter-spacing:.02em;transition:box-shadow .15s,opacity .15s;font-family:'Inter',sans-serif;}
.rsc-btn.dim{opacity:.25;}
.rsc-btn.sku-open{opacity:1;}

/* SKU drill-down */
.sku-drill-panel{padding:0 0 12px;}
.sku-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px;}
.sku-split-col{background:var(--bg);border-radius:10px;padding:10px;}
.sku-split-hdr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.sku-acct-row{padding:7px 0;border-bottom:1px solid var(--card-border);}
.sku-acct-row:last-child{border-bottom:none;}
.sku-acct-name{font-size:12px;font-weight:700;color:var(--text);}
.sku-acct-note{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4;}
.sku-acct-note.no-note{color:#cbd5e1;font-style:italic;}
.sku-acct-photo-tag{font-size:9px;font-weight:700;background:#eff6ff;color:var(--brand);padding:1px 6px;border-radius:99px;margin-top:2px;display:inline-block;}
.sku-empty-state{font-size:11px;color:var(--text3);padding:8px 0;text-align:center;}

/* SKU chips under rep */
.rep-sku-row{display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap;}
.rsc{height:22px;padding:0 8px;border-radius:99px;font-size:9px;font-weight:800;color:#fff;display:inline-flex;align-items:center;gap:3px;letter-spacing:.02em;}
.rsc.dim{opacity:.25;}

/* Drill panel */
.drill-panel{border-top:1.5px solid var(--card-border);padding:14px 16px;display:none;}
.drill-panel.open{display:block;}
.drill-title{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.drill-search{width:100%;background:var(--input-bg);border:1.5px solid var(--card-border);border-radius:8px;padding:9px 12px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);outline:none;margin-bottom:10px;}
.drill-search:focus{border-color:var(--brand);}
.mini-ac{background:var(--bg);border:1.5px solid var(--card-border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.ma-name{flex:1;font-size:12px;font-weight:700;min-width:0;color:var(--text);}
.ma-addr{font-size:9px;color:var(--text3);margin-top:1px;}
.ma-dots{display:flex;gap:4px;}
.ma-dot{width:9px;height:9px;border-radius:50%;}
.ma-pct{font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;flex-shrink:0;min-width:32px;text-align:right;}
.ma-del{width:22px;height:22px;background:#fef2f2;color:var(--red);border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.drill-add{display:flex;gap:8px;margin-top:10px;}
.drill-add-input{flex:1;background:var(--input-bg);border:1.5px solid var(--card-border);border-radius:8px;padding:9px 12px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);outline:none;}
.drill-add-input:focus{border-color:var(--brand);}
.drill-add-btn{padding:9px 14px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}

/* Right column cards */
.right-col{display:flex;flex-direction:column;gap:14px;}

/* SKU progress */
.sku-prog-item{margin-bottom:14px;}
.sku-prog-item:last-child{margin-bottom:0;}
.sku-prog-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.sku-prog-name{font-size:13px;font-weight:700;color:var(--text);}
.sku-prog-stat{font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;}
.sku-prog-track{height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden;}
.sku-prog-fill{height:100%;border-radius:99px;transition:width .6s;}

/* Attention list */
.attention-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1.5px solid var(--bg);}
.attention-item:last-child{border-bottom:none;}
.att-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.att-name{font-size:13px;font-weight:700;color:var(--text);}
.att-issue{font-size:11px;color:var(--text3);margin-top:2px;}

/* SKU manager view */
.info-box{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:14px 16px;font-size:13px;color:#1e40af;margin-bottom:18px;font-weight:500;}
.sku-mgr{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:20px;}
.sku-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px solid var(--bg);}
.sku-row:last-of-type{border-bottom:none;}
.sku-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.sku-row-name{flex:1;font-size:13px;font-weight:700;color:var(--text);}
.sku-del{width:26px;height:26px;background:#fef2f2;color:var(--red);border:none;border-radius:50%;font-size:12px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.add-sku-row{display:flex;gap:8px;margin-top:14px;}
.ski{flex:1;background:var(--input-bg);border:1.5px solid var(--card-border);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);outline:none;}
.ski:focus{border-color:var(--brand);}
.sci{width:40px;height:38px;border:1.5px solid var(--card-border);border-radius:8px;cursor:pointer;padding:2px;}
.btn-as{padding:9px 16px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;}

/* Search */
.search-bar{margin-bottom:14px;}
.si-wrap{position:relative;}
.si{width:100%;background:var(--card);border:1.5px solid var(--card-border);border-radius:10px;padding:11px 36px 11px 14px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;}
.si:focus{border-color:var(--brand);}
.si-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px;display:none;}
.si-clear.show{display:block;}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--text3);}
.empty h3{font-size:16px;font-weight:800;color:var(--text2);margin-bottom:8px;}
.empty p{font-size:13px;line-height:1.6;max-width:300px;margin:0 auto 20px;}
.btn-refresh{padding:10px 20px;background:var(--brand);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}

/* Photo viewer */
.pv-bk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.pv-bk.open{display:flex;}
.pv-img{max-width:100%;max-height:70vh;border-radius:12px;object-fit:contain;}
.pv-label{color:#fff;font-size:15px;font-weight:800;margin-top:14px;}
.pv-sub{color:#94a3b8;font-size:12px;margin-top:4px;}
.pv-close-btn{margin-top:18px;padding:10px 24px;background:#fff;color:#0f172a;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.ma-photo-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;cursor:pointer;border:1.5px solid var(--card-border);}

/* Sum bar (inside main content) */
.sum-bar{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:18px 20px;margin-bottom:20px;}
.sum-row{display:flex;gap:14px;align-items:center;}
.sum-big{flex:1;}
.sum-lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.sum-val{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1;}
.sum-val span{font-size:14px;font-weight:600;color:var(--text2);font-family:'Inter',sans-serif;}
.sdiv{width:1px;height:44px;background:var(--card-border);}
.ss{text-align:center;min-width:52px;}
.ss-val{font-size:20px;font-weight:900;font-family:'JetBrains Mono',monospace;}
.ss-lbl{font-size:10px;color:var(--text3);font-weight:600;margin-top:2px;}
.tbar{height:4px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:14px;}
.tbar-fill{height:100%;border-radius:99px;transition:width .6s;}

/* Sec header */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sec-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);}
.sec-count{font-size:11px;color:var(--text3);font-weight:600;}

/* Confirmation modal */
.conf-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:flex-end;justify-content:center;}
.conf-modal.open{display:flex;}
.conf-sheet{background:#fff;border-radius:20px 20px 0 0;padding:28px 20px 36px;width:100%;max-width:520px;box-shadow:0 -4px 24px rgba(0,0,0,.1);}
.conf-msg{font-size:15px;font-weight:700;color:var(--text);text-align:center;margin-bottom:24px;line-height:1.5;}
.conf-btns{display:flex;gap:10px;}
.conf-btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
.conf-cancel{background:var(--input-bg);color:var(--text2);}
.conf-yes{background:var(--red);color:#fff;}

@media(max-width:768px){
  .app-shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .kpi-strip{grid-template-columns:repeat(2,1fr);}
  .main-grid{grid-template-columns:1fr;}
  .content{padding:16px;}
  .topbar{padding:16px;}
}
</style>
</head>
<body>

<div class="app-shell">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="wordmark">Tyler <span>Bev.</span></div>
      <div class="route-tag">
        <span class="sync-dot" style="width:6px;height:6px;background:#16a34a;border-radius:50%;display:inline-block;"></span>
        Manager Dashboard
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Views</div>
      <button class="nav-item active" data-act="showView" data-id="team">
        <span class="nav-item-icon">◈</span>
        <span class="nav-item-label">Team Dashboard</span>
      </button>
      <button class="nav-item" data-act="showView" data-id="skus">
        <span class="nav-item-icon">⊕</span>
        <span class="nav-item-label">Manage SKUs</span>
      </button>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section" style="flex:1;overflow-y:auto;">
      <div class="sidebar-label">Reps</div>
      <div id="repSidebarList">
        <div style="font-size:12px;color:var(--text3);padding:8px 12px;">No reps synced yet</div>
      </div>
    </div>

    <div class="sync-area">
      <button class="sync-badge" id="syncBadge" data-act="loadFromDB">
        <span class="sync-dot"></span>
        Refresh

async function sbFetch(path,opts={}){
  const res=await fetch(SB_URL+path,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal',...(opts.headers||{})},method:opts.method||'GET',body:opts.body});

    const skuRows=await sbFetch('/rest/v1/uds_master_skus?select=*&order=sort_order',{headers:{'Prefer':''}});

      masterSKUs=skuRows.map(function(r){return{id:r.id,name:r.name,short:r.short,color:r.color};});
      saveMeta();

    const rows=await sbFetch('/rest/v1/uds_rep_syncs?select=*&order=synced_at.desc',{headers:{'Prefer':''}});

    const isOpen=!!openDrills[actualRi];
    const openSkuId=openSkuDrills[actualRi]||null;
    const visAccts=skuFil?accts.filter(function(a){return !a[skuFil];}):accts;

    h+='<div class="rep-card">';
    h+='<div class="rep-hdr" data-act="togDrill" data-ri="'+actualRi+'">';
    h+='<div class="rep-info"><div class="rep-name">'+escH(rep.repName||rep._repName||'Rep')+'</div>';
    h+='<div class="rep-route">'+(rep.routeName||rep._routeName||'')+'</div>';
    if(rep.syncedAt)h+='<div class="rep-ts">Synced: '+rep.syncedAt+'</div>';
    h+='</div>';
    h+='<div class="rep-right"><div class="rep-pct" style="color:'+col+'">'+pct+'%</div><div class="rep-acct-count">'+accts.length+' accounts</div></div>';
    h+='<div style="font-size:18px;color:var(--text3);margin-left:8px">'+(isOpen?'▾':'▸')+'</div>';
    h+='</div>';

    // Progress bar
    h+='<div class="rep-bar"><div class="rep-bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div>';

    // SKU chips — now tappable to drill in/out
    h+='<div class="rep-sku-row">';
    masterSKUs.forEach(function(s){
      const have=accts.filter(function(a){return a[s.id];}).length;
      const sp=accts.length?Math.round(have/accts.length*100):0;
      const isSkuOpen=isOpen&&openSkuId===s.id;
      h+='<button class="rsc-btn'+(sp===0?' dim':'')+(isSkuOpen?' sku-open':'')+'" data-act="togSkuDrill" data-ri="'+actualRi+'" data-skuid="'+escH(s.id)+'" style="background:'+s.color+(isSkuOpen?';box-shadow:0 0 0 2px #0f172a,0 0 0 4px '+s.color:'')+'">'+escH(s.short)+' '+sp+'%</button>';
    });
    h+='</div>';

    // SKU drill-down — IN / MISSING split
    if(isOpen&&openSkuId){
      const s=masterSKUs.find(function(x){return x.id===openSkuId;});
      if(s){
        const inAccts=accts.filter(function(a){return a[s.id];});
        const missingAccts=accts.filter(function(a){return !a[s.id];});
        h+='<div class="sku-drill-panel" style="border-top:2px solid '+s.color+'20;">';
        h+='<div style="display:flex;align-items:center;gap:8px;padding:10px 16px 8px;"><div style="width:10px;height:10px;border-radius:50%;background:'+s.color+';flex-shrink:0;"></div><div style="font-size:12px;font-weight:800;color:'+s.color+'">'+escH(s.name)+'</div><div style="margin-left:auto;font-size:10px;color:var(--text3)">tap chip again to close</div></div>';
        h+='<div class="sku-split">';

        // IN column
        h+='<div class="sku-split-col sku-in">';
        h+='<div class="sku-split-hdr" style="color:var(--green)">✓ In ('+inAccts.length+')</div>';
        if(inAccts.length){
          inAccts.forEach(function(a){
            const note=a['note_'+s.id];const photo=!!a['photo_'+s.id];
            h+='<div class="sku-acct-row sku-acct-in">';
            h+='<div class="sku-acct-name">'+escH(a.name)+'</div>';
            if(note)h+='<div class="sku-acct-note">📝 '+escH(note.slice(0,40))+'</div>';
            if(photo)h+='<span class="sku-acct-photo-tag">📷 photo</span>';
            h+='</div>';
          });
        }else{h+='<div class="sku-empty-state">None placed yet</div>';}
        h+='</div>';

        // MISSING column
        h+='<div class="sku-split-col sku-missing-col">';
        h+='<div class="sku-split-hdr" style="color:var(--red)">✗ Missing ('+missingAccts.length+')</div>';
        if(missingAccts.length){
          missingAccts.forEach(function(a){
            const note=a['note_'+s.id];
            h+='<div class="sku-acct-row sku-acct-miss">';
            h+='<div class="sku-acct-name">'+escH(a.name)+'</div>';
            if(note)h+='<div class="sku-acct-note">📝 '+escH(note.slice(0,40))+'</div>';
            else h+='<div class="sku-acct-note no-note">no note</div>';
            h+='</div>';
          });
        }else{h+='<div class="sku-empty-state" style="color:var(--green)">✓ 100% placed!</div>';}
        h+='</div>';

        h+='</div></div>';
      }
    }

    // Account drill panel
    h+='<div class="drill-panel'+(isOpen?' open':'')+'">';
    h+='<div class="drill-title">Account Breakdown'+(skuFil?' — missing '+escH(masterSKUs.find(function(x){return x.id===skuFil;})||{name:''}).name:'')+' ('+visAccts.length+' of '+accts.length+')</div>';
    h+='<input class="drill-search" id="drillSearch_'+actualRi+'" placeholder="Filter accounts..." value="'+(drillSearch[actualRi]||'')+'">';

    const query=(drillSearch[actualRi]||'').toLowerCase();
    const dispAccts=visAccts.filter(function(a){return !query||a.name.toLowerCase().includes(query)||(a.addr||'').toLowerCase().includes(query);});

    dispAccts.forEach(function(a){
      const ap=acctDist(a);
      const noteTags=masterSKUs.filter(function(s){return a['note_'+s.id];}).map(function(s){return'<span style="font-size:9px;background:'+s.color+'22;color:'+s.color+';padding:2px 6px;border-radius:99px;font-weight:700">'+escH(s.short)+'</span>';}).join('');
      const photoThumbs=masterSKUs.filter(function(s){return a['photo_'+s.id];}).map(function(s){return'<img class="ma-photo-thumb" src="'+a['photo_'+s.id]+'" data-act="viewMgrPhoto" data-ri="'+actualRi+'" data-acid="'+escH(a.id)+'" data-skuid="'+escH(s.id)+'" title="Photo: '+escH(s.name)+'">';}).join('');
      const dots=masterSKUs.map(function(s){return'<div class="ma-dot" style="background:'+s.color+';opacity:'+(a[s.id]?1:.2)+'"></div>';}).join('');
      h+='<div class="mini-ac"><div style="flex:1;min-width:0"><div class="ma-name">'+escH(a.name)+'</div>'+(a.addr?'<div class="ma-addr">'+escH(a.addr)+'</div>':'')+(noteTags?'<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px">'+noteTags+'</div>':'')+(photoThumbs?'<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">'+photoThumbs+'</div>':'')+'</div><div class="ma-dots">'+dots+'</div><div class="ma-pct" style="color:'+dc(ap)+'">'+ap+'%</div></div>';
    });

    h+='<div class="drill-add"><input class="drill-add-input" id="addAcctInput_'+actualRi+'" placeholder="Add account name..."><button class="drill-add-btn" data-act="addAccountToRep" data-ri="'+actualRi+'">+ Add</button></div>';
    h+='</div>';
    h+='</div>';
  });

  h+='</div></div>';

  // Right column
  h+='<div class="right-col">';

  // SKU penetration card
  if(masterSKUs.length){
    h+='<div class="card"><div class="card-hdr"><div class="card-title">SKU Penetration</div></div>';
    masterSKUs.forEach(function(s){
      const have=allAccts.filter(function(a){return a[s.id];}).length;
      const p=allAccts.length?Math.round(have/allAccts.length*100):0;
      h+='<div class="sku-prog-item"><div class="sku-prog-hdr"><div class="sku-prog-name">'+escH(s.name)+'</div><div class="sku-prog-stat" style="color:'+s.color+'">'+have+'/'+allAccts.length+'</div></div><div class="sku-prog-track"><div class="sku-prog-fill" style="width:'+p+'%;background:'+s.color+'"></div></div></div>';
    });
    h+='</div>';
  }

  // Needs attention card
  const attnReps=filteredReps.filter(function(r){return repDist(r)<60;});
  if(attnReps.length){
    h+='<div class="card"><div class="card-hdr"><div class="card-title">Needs Attention</div></div>';
    attnReps.forEach(function(r){
      const pct=repDist(r);
      h+='<div class="attention-item"><div class="att-dot" style="background:var(--red)"></div><div><div class="att-name">'+escH(r.repName||r._repName||'Rep')+'</div><div class="att-issue">'+pct+'% — below 60% target</div></div></div>';
    });
    h+='</div>';
  }

  // Quick stats card
  h+='<div class="card"><div class="card-hdr"><div class="card-title">Quick Stats</div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  const atTarget=filteredReps.filter(function(r){return repDist(r)>=80;}).length;
  [
    {label:'Missing',val:missing,col:'var(--red)'},
    {label:'At Target (80%+)',val:atTarget+'/'+filteredReps.length,col:'var(--green)'},
    {label:'Below 60%',val:belowTarget,col:belowTarget>0?'var(--red)':'var(--green)'},
    {label:'Total Accounts',val:allAccts.length,col:'var(--brand)'},
  ].forEach(function(st){
    h+='<div style="background:var(--bg);border-radius:10px;padding:12px"><div style="font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px">'+st.label+'</div><div style="font-size:22px;font-weight:900;font-family:JetBrains Mono,monospace;color:'+st.col+'">'+st.val+'</div></div>';
  });
  h+='</div></div>';

  h+='</div>';
  h+='</div>';

  root.innerHTML=h;
  updateSidebar();
  setTimeout(wireInputs, 0);
}

function setTeamFilter(v){teamFilter=v;render();}
function togDrill(ri){openDrills[ri]=!openDrills[ri];if(!openDrills[ri])delete openSkuDrills[ri];render();}
function togSkuDrill(ri,skuid){
  if(!openDrills[ri]){openDrills[ri]=true;}
  openSkuDrills[ri]=(openSkuDrills[ri]===skuid)?null:skuid;
  render();
}
function togSKUFil(id){skuFil=(skuFil===id)?null:id;render();}
function clearSKUFil(){togSKUFil(null);}
function onRepSearch(e){const v=e.target.value.toLowerCase();document.querySelectorAll('.rep-card').forEach(function(c){const n=c.querySelector('.rep-name');if(n)c.style.display=n.textContent.toLowerCase().includes(v)?'':'none';});}
function clearRepSearch(){const si=document.getElementById('repSearch');if(si){si.value='';document.querySelectorAll('.rep-card').forEach(function(c){c.style.display='';});const cl=document.getElementById('repSearchClear');if(cl)cl.classList.remove('show');}}
function onDrillSearch(ri,v){drillSearch[ri]=v;render();}

async function addAccountToRep(ri){
  const rep=reps[ri];
  const input=document.getElementById('addAcctInput_'+ri);
  if(!input)return;
  const name=input.value.trim();if(!name)return;
  const o={id:name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')+Date.now(),name:name,addr:''};
  (rep.skus||masterSKUs).forEach(function(s){o[s.id]=false;});
  rep.accounts.push(o);
  input.value='';
  render();
  await pushRepUpdate(rep);
}

async function deleteAccountFromRep(ri,acctId){
  const rep=reps[ri];
  const acct=(rep.accounts||[]).find(function(a){return a.id===acctId;});
  const name=acct?acct.name:'this account';
  showConfirm('Remove "'+name+'" from '+rep._repName+'\'s list?', async function(){
    rep.accounts=(rep.accounts||[]).filter(function(a){return a.id!==acctId;});
    render();
    await pushRepUpdate(rep);
  });
}

function removeAllReps(){
  showConfirm('Clear all rep data from the dashboard?', function(){
    reps=[];render();
  });
}

function renderSKUs(){
  const root=document.getElementById('appRoot');
  let h='<div class="info-box">Changes here update Supabase immediately. Reps will receive the updated SKU list on their next Sync — no extra steps needed.</div>';
  h+='<div class="sku-mgr"><div style="font-size:13px;font-weight:700;margin-bottom:14px;color:var(--text2)">Active SKUs ('+masterSKUs.length+')</div>';
  masterSKUs.forEach(function(s){
    h+='<div class="sku-row"><div class="sku-dot" style="background:'+s.color+'"></div><div class="sku-row-name">'+escH(s.name)+'</div><button class="sku-del" data-act="delMSKU" data-skuid="'+escH(s.id)+'">&#x2715;</button></div>';
  });
  h+='<div class="add-sku-row"><input class="ski" id="newSKUName" placeholder="New SKU name..."><input type="color" class="sci" id="newSKUColor" value="#2563eb"><button class="btn-as" data-act="addMSKU">+ Add SKU</button></div></div>';
  root.innerHTML=h;
  setTimeout(wireInputs, 0);
}

async function addMSKU(){
  const name=document.getElementById('newSKUName').value.trim();if(!name)return;
  const color=document.getElementById('newSKUColor').value;
  const id=name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')+Date.now();
  masterSKUs.push({id:id,name:name,short:name.length>14?name.slice(0,14)+'...':name,color:color});
  saveMeta();await pushSKUsToDB();render();
}
async function delMSKU(id){
  const s=masterSKUs.find(function(x){return x.id===id;});
  showConfirm('Remove "'+escH(s?s.name:'this SKU')+'" from the master list? Reps will lose this SKU on next sync.', async function(){
    masterSKUs=masterSKUs.filter(function(x){return x.id!==id;});
    saveMeta();
    try{await sbFetch('/rest/v1/uds_master_skus?id=eq.'+id,{method:'DELETE'});}catch(e){}
    render();
  });
}

function viewMgrPhoto(ri,acctId,skuId){
  const rep=reps[ri];
  const a=(rep.accounts||[]).find(function(x){return x.id===acctId;});
  const s=masterSKUs.find(function(x){return x.id===skuId;});
  if(!a||!s||!a['photo_'+skuId])return;
  document.getElementById('photoViewerImg').src=a['photo_'+skuId];
  document.getElementById('photoViewerLabel').textContent=a.name+' — '+s.name;
  document.getElementById('photoViewerSub').textContent=(rep.repName||'')+(a['photo_ts_'+skuId]?' · '+a['photo_ts_'+skuId]:'')+(a[skuId]?' · Placed':' · Not yet placed');
  document.getElementById('photoViewerBk').classList.add('open');
}
function closePhotoViewer(){document.getElementById('photoViewerBk').classList.remove('open');}
document.getElementById('photoViewerBk').addEventListener('click',function(e){if(e.target===this)closePhotoViewer();});

localStorage.removeItem('uds_mgr_skus_v2');
loadMeta();
render();
loadFromDB();
setInterval(loadFromDB,60000);

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const act=el.getAttribute('data-act');
  const id=el.getAttribute('data-id');
  const ri=el.getAttribute('data-ri');
  const acid=el.getAttribute('data-acid');
  const skuid=el.getAttribute('data-skuid');
  if(act==='loadFromDB')loadFromDB();
  else if(act==='showView')showView(id);
  else if(act==='closePhotoViewer')closePhotoViewer();
  else if(act==='setTeamFilter')setTeamFilter(id);
  else if(act==='togSKUFil')togSKUFil(skuid);
  else if(act==='clearSKUFil')clearSKUFil();
  else if(act==='clearRepSearch')clearRepSearch();
  else if(act==='togDrill')togDrill(Number(ri));
  else if(act==='togSkuDrill')togSkuDrill(Number(ri),skuid);
  else if(act==='addAccountToRep')addAccountToRep(Number(ri));
  else if(act==='deleteAccountFromRep')deleteAccountFromRep(Number(ri),acid);
  else if(act==='viewMgrPhoto')viewMgrPhoto(Number(ri),acid,skuid);
  else if(act==='removeAllReps')removeAllReps();
  else if(act==='delMSKU')delMSKU(skuid);
  else if(act==='addMSKU')addMSKU();
  else if(act==='closeConfirm')closeConfirm();
  else if(act==='doConfirm')doConfirm();
});

function wireInputs(){
  const rs=document.getElementById('repSearch');
  if(rs&&!rs._wired){rs.addEventListener('input',onRepSearch);rs._wired=true;}
  document.querySelectorAll('[id^="drillSearch_"]').forEach(function(inp){
    if(!inp._wired){
      const ri=Number(inp.id.replace('drillSearch_',''));
      inp.addEventListener('input',function(){onDrillSearch(ri,this.value);});
      inp._wired=true;
    }
  });
  const sn=document.getElementById('newSKUName');
  if(sn&&!sn._wired){sn.addEventListener('input',function(){});sn._wired=true;}
}

let _confirmCallback=null;
function showConfirm(msg,onYes){_confirmCallback=onYes;document.getElementById('confirmMsg').textContent=msg;document.getElementById('confirmModal').classList.add('open');}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('open');_confirmCallback=null;}
function doConfirm(){const cb=_confirmCallback;closeConfirm();if(cb)cb();}
</script>

<div class="conf-modal" id="confirmModal">
  <div class="conf-sheet">
    <div class="conf-msg" id="confirmMsg"></div>
    <div class="conf-btns">
      <button class="conf-btn conf-cancel" data-act="closeConfirm">Cancel</button>
      <button class="conf-btn conf-yes" data-act="doConfirm">Delete</button>
    </div>
  </div>
</div>
</body>
</html>
